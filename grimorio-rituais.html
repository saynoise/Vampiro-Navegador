<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grimório de Rituais • Vampiro: A Máscara (V20)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .grimorio-nav-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(14, 14, 18, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--border-accent);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .grimorio-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .grimorio-search-box {
      flex: 1;
      max-width: 460px;
      position: relative;
    }
    .grimorio-search-input {
      width: 100%;
      background: var(--bg-input);
      border: 1.5px solid var(--border-accent);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 1.05rem;
      padding: 8px 14px 8px 36px;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    .grimorio-search-input:focus {
      border-color: var(--gold-bright);
      box-shadow: 0 0 12px var(--gold-glow);
    }
    .grimorio-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      pointer-events: none;
      opacity: 0.6;
    }
    .grimorio-filter-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      margin: 18px 0 24px 0;
      background: #12111a;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
    }
    .grimorio-filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    .grimorio-filter-label {
      font-family: var(--font-header);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gold-base);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-right: 4px;
      white-space: nowrap;
    }
    .grimorio-pill {
      background: #1c1824;
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 6px 14px;
      font-family: var(--font-header);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .grimorio-pill:hover {
      color: var(--gold-bright);
      border-color: var(--gold-base);
      background: #272333;
    }
    .grimorio-pill.active {
      background: linear-gradient(180deg, #701111 0%, #400808 100%);
      color: #ffffff;
      border-color: var(--crimson-bright);
      box-shadow: 0 0 10px var(--crimson-glow);
    }
    .grimorio-stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    .grimorio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 18px;
      margin-bottom: 40px;
    }
    .ritual-card {
      background: var(--bg-card-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s ease;
      position: relative;
    }
    .ritual-card:hover {
      border-color: var(--gold-base);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), 0 0 10px rgba(197, 160, 89, 0.2);
      transform: translateY(-2px);
    }
    .ritual-card.tradition-taumaturgia {
      border-top: 3px solid var(--crimson-bright);
    }
    .ritual-card.tradition-necromancia {
      border-top: 3px solid #8b5cf6;
    }
    .ritual-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .ritual-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .ritual-title {
      font-family: var(--font-header);
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--gold-bright);
      line-height: 1.2;
    }
    .ritual-subtitle-en {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-style: italic;
    }
    .ritual-level-tag {
      background: #2b1115;
      color: #ff7777;
      border: 1px solid #772222;
      border-radius: 4px;
      padding: 3px 8px;
      font-family: var(--font-header);
      font-size: 0.84rem;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ritual-meta-box {
      background: #111018;
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }
    .ritual-meta-row strong {
      color: var(--gold-base);
    }
    .ritual-desc {
      font-size: 0.95rem;
      color: var(--text-primary);
      line-height: 1.45;
      flex: 1;
    }
    .ritual-system-box {
      font-size: 0.86rem;
      background: rgba(0, 0, 0, 0.35);
      border-left: 3px solid var(--gold-dark);
      padding: 6px 10px;
      color: #e5e5e5;
      line-height: 1.4;
    }
    .ritual-card-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
      padding-top: 10px;
      margin-top: 4px;
    }
    .ritual-wiki-link {
      font-size: 0.78rem;
      color: var(--gold-base);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }
    .ritual-wiki-link:hover {
      color: #ffffff;
      text-decoration: underline;
    }
    .ritual-actions-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-ritual-action {
      background: #1e1d2a;
      color: var(--gold-bright);
      border: 1px solid var(--border-accent);
      border-radius: 3px;
      padding: 4px 8px;
      font-family: var(--font-header);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-ritual-action:hover {
      background: var(--crimson-dark);
      border-color: var(--crimson-bright);
      color: #ffffff;
      box-shadow: 0 0 8px var(--crimson-glow);
    }
    .btn-ritual-add {
      background: linear-gradient(180deg, #601217 0%, #30080b 100%);
      border-color: var(--crimson-bright);
      color: #ffffff;
    }
    .btn-ritual-add:hover {
      background: linear-gradient(180deg, #85161c 0%, #4a0c11 100%);
      box-shadow: 0 0 10px var(--crimson-glow);
    }
    .grimorio-no-results {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 1.1rem;
      grid-column: 1 / -1;
    }
    @media (max-width: 600px) {
      .grimorio-grid { grid-template-columns: 1fr; }
      .grimorio-nav-bar { flex-direction: column; align-items: stretch; }
      .grimorio-search-box { max-width: 100%; }
      .grimorio-filter-group { justify-content: flex-start; }
    }
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGAÇÃO -->
  <nav class="grimorio-nav-bar">
    <a href="index.html" class="grimorio-brand" title="Voltar à Ficha de Personagem">
      <span class="ankh-symbol">☥</span>
      <div class="brand-text">
        <h1 style="font-size: 1.1rem; margin: 0;">VAMPIRO: A MÁSCARA</h1>
        <span class="edition-badge">Grimório Oficial de Rituais (V20)</span>
      </div>
    </a>

    <div class="grimorio-search-box">
      <span class="grimorio-search-icon">🔍</span>
      <input type="text" id="ritual-search-input" class="grimorio-search-input" placeholder="Pesquisar rituais por nome, componentes ou efeitos..." aria-label="Pesquisar rituais">
    </div>

    <div>
      <a href="index.html" class="btn btn-primary" title="Voltar para a ficha">
        <span class="btn-icon">⬅</span> Voltar à Ficha
      </a>
    </div>
  </nav>

  <div class="sheet-viewport" style="margin-top: 24px;">
    <div class="sheet-card" style="padding: 28px;">

      <div class="gothic-header-ornament">
        <div class="ornament-line"></div>
        <div class="ornament-center">
          <span class="gothic-ankh">📜</span>
          <h2>GRIMÓRIO DE RITUAIS V20</h2>
          <span class="sheet-subtitle">CATÁLOGO OFICIAL DA WHITE WOLF WIKI (TAUMATURGIA & NECROMANCIA)</span>
        </div>
        <div class="ornament-line"></div>
      </div>

      <!-- FILTROS POR NÍVEL E ESCOLA -->
      <div class="grimorio-filter-section">
        <!-- LINHA 1: NÍVEL DO RITUAL (1 A 5) -->
        <div class="grimorio-filter-group" id="filter-level-group">
          <span class="grimorio-filter-label">🔮 Nível:</span>
          <button type="button" class="grimorio-pill active" data-level="all">Todos os Níveis (<span id="count-all">0</span>)</button>
          <button type="button" class="grimorio-pill" data-level="1">Nível 1</button>
          <button type="button" class="grimorio-pill" data-level="2">Nível 2</button>
          <button type="button" class="grimorio-pill" data-level="3">Nível 3</button>
          <button type="button" class="grimorio-pill" data-level="4">Nível 4</button>
          <button type="button" class="grimorio-pill" data-level="5">Nível 5</button>
        </div>

        <!-- LINHA 2: TRADIÇÃO / ESCOLA -->
        <div class="grimorio-filter-group" id="filter-tradition-group">
          <span class="grimorio-filter-label">🩸 Escola:</span>
          <button type="button" class="grimorio-pill active" data-tradition="all">Todas as Escolas</button>
          <button type="button" class="grimorio-pill" data-tradition="taumaturgia">🩸 Taumaturgia Hermética</button>
          <button type="button" class="grimorio-pill" data-tradition="necromancia">💀 Necromancia</button>
        </div>
      </div>

      <div class="grimorio-stats-bar">
        <span id="results-count-display">Exibindo todos os rituais</span>
        <span style="font-size: 0.8rem; font-style: italic;">Clique em "➕ Adicionar à Ficha" para incluir no seu Grimório pessoal</span>
      </div>

      <!-- GRID DE CARDS -->
      <div class="grimorio-grid" id="ritual-cards-grid">
        <!-- Itens inseridos dinamicamente pelo JavaScript -->
      </div>

    </div>
  </div>

  <script src="grimorio-rituais-data.js"></script>
  <script>
    const grid = document.getElementById('ritual-cards-grid');
    const searchInput = document.getElementById('ritual-search-input');
    const levelPills = document.querySelectorAll('#filter-level-group .grimorio-pill');
    const traditionPills = document.querySelectorAll('#filter-tradition-group .grimorio-pill');
    const resultsCountDisplay = document.getElementById('results-count-display');

    let currentLevel = 'all';         // 'all', '1', '2', '3', '4', '5'
    let currentTradition = 'all';     // 'all', 'taumaturgia', 'necromancia'
    let searchQuery = '';

    document.getElementById('count-all').textContent = RITUALS_DATA.length;

    const STORAGE_KEY = 'v20_character_sheets_db';
    const ACTIVE_CHAR_KEY = 'v20_active_char_id';

    // Função para adicionar ritual diretamente à ficha salva no localStorage
    function addRitualToActiveSheet(ritual, btnEl) {
      try {
        const storageRaw = localStorage.getItem(STORAGE_KEY);
        if (!storageRaw) {
          alert('Abra sua ficha primeiro no navegador para poder adicionar rituais diretamente!');
          return;
        }

        const characters = JSON.parse(storageRaw);
        const activeId = localStorage.getItem(ACTIVE_CHAR_KEY);
        const char = characters.find(c => c.id === activeId) || characters[0];

        if (!char) {
          alert('Nenhum personagem ativo encontrado na ficha!');
          return;
        }

        if (!Array.isArray(char.rituals_list)) char.rituals_list = [];

        // Verifica se o ritual já está na lista
        const alreadyExists = char.rituals_list.some(r => r.name.toLowerCase() === ritual.name.toLowerCase());
        if (alreadyExists) {
          btnEl.textContent = '✓ Já Adicionado!';
          btnEl.style.color = '#ffcc00';
          setTimeout(() => {
            btnEl.textContent = '➕ Adicionar à Ficha';
            btnEl.style.color = '';
          }, 2000);
          return;
        }

        // Adiciona à lista do personagem
        char.rituals_list.push({
          id: 'v20_rit_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 6),
          level: ritual.level,
          name: ritual.name,
          description: `${ritual.desc}\n\n[Sistema]: ${ritual.system}\n[Componentes]: ${ritual.components}\n[Fonte]: ${ritual.book}`
        });

        localStorage.setItem(STORAGE_KEY, JSON.stringify(characters));

        btnEl.textContent = '✓ Adicionado à Ficha!';
        btnEl.style.color = '#55ff55';
        setTimeout(() => {
          btnEl.textContent = '➕ Adicionar à Ficha';
          btnEl.style.color = '';
        }, 2500);

      } catch (err) {
        console.error('Erro ao adicionar ritual:', err);
        alert('Não foi possível salvar diretamente na ficha. Use o botão Copiar.');
      }
    }

    function renderCards() {
      grid.innerHTML = '';
      const q = searchQuery.toLowerCase().trim();

      const filtered = RITUALS_DATA.filter(item => {
        // 1. Filtro de Nível
        if (currentLevel !== 'all' && item.level.toString() !== currentLevel) return false;

        // 2. Filtro de Tradição
        if (currentTradition !== 'all' && item.tradition !== currentTradition) return false;

        // 3. Filtro de Busca por Texto
        if (q) {
          const matchText = `${item.name} ${item.nameEn} ${item.level} ${item.tradition} ${item.desc} ${item.components} ${item.system} ${item.book}`.toLowerCase();
          if (!matchText.includes(q)) return false;
        }

        return true;
      });

      let levelText = currentLevel === 'all' ? '' : ` • Nível ${currentLevel}`;
      let tradText = currentTradition === 'all' ? 'Todos os Rituais' : (currentTradition === 'taumaturgia' ? 'Taumaturgia' : 'Necromancia');
      resultsCountDisplay.textContent = `Exibindo ${filtered.length} de ${RITUALS_DATA.length} rituais • ${tradText}${levelText}`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="grimorio-no-results">Nenhum ritual encontrado para os filtros selecionados (${tradText}${levelText}${q ? ' com busca "' + searchQuery + '"' : ''}).</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = `ritual-card tradition-${item.tradition}`;

        const schoolName = item.tradition === 'taumaturgia' ? 'Taumaturgia Hermética' : 'Necromancia';

        card.innerHTML = `
          <div class="ritual-card-top">
            <div class="ritual-title-group">
              <span style="font-size: 0.72rem; color: var(--gold-base); font-family: var(--font-header); font-weight: 700; text-transform: uppercase;">${schoolName}</span>
              <h3 class="ritual-title">${item.name}</h3>
              <span class="ritual-subtitle-en">${item.nameEn}</span>
            </div>
            <span class="ritual-level-tag">Nível ${item.level}</span>
          </div>

          <div class="ritual-meta-box">
            <div class="ritual-meta-row"><strong>⏳ Tempo:</strong> ${item.castTime}</div>
            <div class="ritual-meta-row"><strong>🌿 Componentes:</strong> ${item.components}</div>
          </div>

          <p class="ritual-desc">${item.desc}</p>

          <div class="ritual-system-box">
            <strong>🎲 Sistema:</strong> ${item.system}
          </div>

          <div class="ritual-card-footer">
            <a href="${item.wikiUrl}" target="_blank" rel="noopener noreferrer" class="ritual-wiki-link" title="Consultar artigo oficial na White Wolf Wiki">
              📖 White Wolf Wiki ↗
            </a>
            
            <div class="ritual-actions-group">
              <button type="button" class="btn-ritual-action btn-copy-ritual" title="Copiar informações do ritual">📋 Copiar</button>
              <button type="button" class="btn-ritual-action btn-ritual-add" title="Adicionar à ficha do personagem ativo">➕ Adicionar à Ficha</button>
            </div>
          </div>
        `;

        const copyBtn = card.querySelector('.btn-copy-ritual');
        copyBtn.addEventListener('click', () => {
          const textToCopy = `${item.name} (${item.nameEn}) - Nível ${item.level} [${schoolName}]:\n${item.desc}\n[Sistema]: ${item.system}\n[Componentes]: ${item.components}\n[Fonte]: ${item.book} (${item.wikiUrl})`;
          navigator.clipboard.writeText(textToCopy).then(() => {
            copyBtn.textContent = '✓ Copiado!';
            copyBtn.style.color = '#55ff55';
            setTimeout(() => {
              copyBtn.textContent = '📋 Copiar';
              copyBtn.style.color = '';
            }, 2000);
          });
        });

        const addBtn = card.querySelector('.btn-ritual-add');
        addBtn.addEventListener('click', () => {
          addRitualToActiveSheet(item, addBtn);
        });

        grid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderCards();
    });

    levelPills.forEach(pill => {
      pill.addEventListener('click', () => {
        levelPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentLevel = pill.getAttribute('data-level');
        renderCards();
      });
    });

    traditionPills.forEach(pill => {
      pill.addEventListener('click', () => {
        traditionPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentTradition = pill.getAttribute('data-tradition');
        renderCards();
      });
    });

    // Render inicial
    renderCards();
  </script>
</body>
</html>
